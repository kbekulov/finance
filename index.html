<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#12201b" />
    <meta
      name="description"
      content="Euroscope — a clear monthly view of expenses, income, and savings."
    />
    <meta http-equiv="refresh" content="0; url=https://euroscope-finance.lateumn.chatgpt.site/" />
    <title>Euroscope — Monthly money, clearly</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        background: #f3f1e9;
        color: #12201b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 75% 20%, #dfff4f55, transparent 24rem),
          #f3f1e9;
      }

      main {
        width: min(100%, 540px);
        border: 1px solid #d9d7cd;
        border-radius: 24px;
        background: #fbfaf5;
        padding: clamp(28px, 7vw, 52px);
        text-align: center;
        box-shadow: 0 24px 70px #12201b18;
      }

      .mark {
        display: grid;
        width: 52px;
        height: 52px;
        margin: 0 auto 24px;
        place-items: center;
        border-radius: 50%;
        background: #12201b;
        color: #dfff4f;
        font-family: Georgia, serif;
        font-size: 34px;
      }

      h1 {
        margin: 0 0 10px;
        font-family: Georgia, serif;
        font-size: clamp(42px, 10vw, 64px);
        font-weight: 400;
        letter-spacing: -0.055em;
      }

      p {
        margin: 0 0 26px;
        color: #66716c;
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        background: #184f3d;
        color: white;
        padding: 0 20px;
        font-weight: 750;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid #dfff4f;
        outline-offset: 4px;
      }
    </style>
    <script>
      window.location.replace("https://euroscope-finance.lateumn.chatgpt.site/");
    </script>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">€</span>
      <h1>Euroscope</h1>
      <p>Opening your private monthly finance tracker…</p>
      <a href="https://euroscope-finance.lateumn.chatgpt.site/">
        Open Euroscope
      </a>
    </main>
  </body>
</html>
